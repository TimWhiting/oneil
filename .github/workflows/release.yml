# Build and publish release artifacts when a version tag is pushed (e.g. `v1.0.0`).
#
# Artifacts: the Rust `oneil` compiler for Linux, Windows, and macOS, plus wheels for
# the Python library (`import oneil`).

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: BUILD (${{ matrix.triple }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_name: oneil-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            archive: zip
            asset_name: oneil-${{ github.ref_name }}-x86_64-pc-windows-msvc
          - runner: macos-latest
            triple: aarch64-apple-darwin
            archive: tar.gz
            asset_name: oneil-${{ github.ref_name }}-aarch64-apple-darwin
          # Intel macOS runners are scarce / often cancelled in queue; ship
          # Apple Silicon only for now. Re-add x86_64-apple-darwin when stable.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Default features include `python-lib` (the `import oneil` module) and
      # `rust-lib` (the compiler). Headers are a build-time PyO3 dependency.
      - name: Set up Python (build-time for PyO3)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.triple }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release -p oneil

      - name: Create archive (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p release
          cp target/release/oneil release/oneil
          chmod +x release/oneil
          tar -czvf "${{ matrix.asset_name }}.tar.gz" -C release oneil

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/oneil.exe release/oneil.exe
          Compress-Archive -Path "release/oneil.exe" -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive }}

  build-python-wheels:
    name: Python library wheels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.0,<2.0"

      - name: Build wheels
        run: maturin build --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: dist/*.whl

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, build-python-wheels]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Build release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="${RUNNER_TEMP}/release-notes.md"
          python3 - "$VERSION" "$OUT" <<'PY'
          import pathlib
          import sys

          version, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          start = text.find(header)
          if start < 0:
              changelog = f"Release {version}. See CHANGELOG.md for details.\n"
          else:
              rest = text[start + len(header) :]
              nl = rest.find("\n")
              body = rest[nl + 1 :] if nl >= 0 else rest
              end = body.find("\n## [")
              section = body if end < 0 else body[:end]
              changelog = section.strip() + "\n"

          notes = f"""{changelog}
          ## Binaries

          Download the archive for your platform and put `oneil` on your `PATH`:

          - `oneil-v{version}-x86_64-unknown-linux-gnu.tar.gz`
          - `oneil-v{version}-x86_64-pc-windows-msvc.zip`
          - `oneil-v{version}-aarch64-apple-darwin.tar.gz` (Apple Silicon macOS)

          See the [installation guide](https://careweather.github.io/oneil/02-installation.html).

          ## Python library

          Wheels for the Python library (`pip install` / `import oneil`) are
          attached. Model `.py` imports through the CLI do not require installing
          a wheel; see Appendix A in the user guide if you need the types from a
          standalone Python process.
          """
          # Dedent the f-string block above (leading spaces from YAML heredoc style).
          import textwrap

          out_path.write_text(textwrap.dedent(notes).strip() + "\n", encoding="utf-8")
          print(f"Wrote release notes ({out_path.stat().st_size} bytes)")
          PY
          echo "path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
